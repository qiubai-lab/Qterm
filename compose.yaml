services:
  qterm:
    image: ${QTERM_IMAGE:-ghcr.io/qiubai-lab/qterm:dev-webruntime}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QTERM_PORT:-8080}:8080"
    environment:
      QTERM_PUBLIC_ORIGIN: ${QTERM_PUBLIC_ORIGIN:-http://localhost:8080}
      QTERM_PASSWORD_FILE: /run/secrets/qterm_password
    secrets:
      - qterm_password
    volumes:
      - qterm-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2

secrets:
  qterm_password:
    file: ${QTERM_PASSWORD_SOURCE_FILE:-./.server-secrets/password}

volumes:
  qterm-data:
