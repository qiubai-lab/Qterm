services:
  qterm:
    image: ${QTERM_IMAGE:-ghcr.io/qiubai-lab/qterm:main}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${QTERM_BIND_HOST:-127.0.0.1}:${QTERM_PORT:-8080}:8080"
    environment:
      QTERM_PUBLIC_ORIGIN: ${QTERM_PUBLIC_ORIGIN:-http://localhost:8080}
      QTERM_ALLOW_INSECURE_HTTP: ${QTERM_ALLOW_INSECURE_HTTP:-false}
      QTERM_PASSWORD_FILE: /run/secrets/qterm_password
    secrets:
      - qterm_password
    volumes:
      - qterm-data:/data
    pids_limit: ${QTERM_PIDS_LIMIT:--1}
    mem_limit: ${QTERM_MEMORY_LIMIT:-0}
    cpus: ${QTERM_CPU_LIMIT:-0}

secrets:
  qterm_password:
    file: ${QTERM_PASSWORD_SOURCE_FILE:-./.server-secrets/password}

volumes:
  qterm-data:
