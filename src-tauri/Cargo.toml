[package]
name = "Qterm"
version = "0.2.13"
description = "A secure cross-platform SSH terminal client"
authors = ["Qterm contributors"]
license = "GPL-3.0-only"
readme = "../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terminal_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10.3"
zeroize = "1.9.0"
atomic-write-file = "0.3.1"
aes-gcm = "0.11.0"
argon2 = "0.5.3"
base64 = "0.23.1"
dirs = "6.0.0"
dunce = "1.0.5"
glob = "0.3.3"
getrandom = "0.4.3"
uuid = { version = "1.24.1", features = ["v4"] }
russh = { version = "=0.62.6", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.4.0"
ssh2-config-rs = { version = "=0.7.2", features = ["nolog"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "sync", "time"] }
portable-pty = "=0.9.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "=2.5.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
windows = { version = "=0.61.3", features = ["Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3.27.0"
