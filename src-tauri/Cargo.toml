[package]
name = "terminal-demo"
version = "0.1.0"
description = "A secure cross-platform SSH terminal client"
authors = ["Terminal Demo contributors"]
license = "GPL-3.0-only"
readme = "../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terminal_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10.3"
zeroize = "1.9.0"
atomic-write-file = "0.3.1"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.23.1"
dirs = "6.0.0"
getrandom = "0.4.3"
uuid = { version = "1.24.1", features = ["v4"] }
russh = { version = "=0.62.4", default-features = false, features = ["ring"] }
russh-sftp = "=2.4.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync", "time"] }
portable-pty = "=0.9.0"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
