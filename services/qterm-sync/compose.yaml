services:
  sync:
    image: ${QTERM_SYNC_IMAGE:?Set QTERM_SYNC_IMAGE to your GHCR image and version}
    restart: unless-stopped
    ports:
      - "${QTERM_SYNC_BIND:-127.0.0.1}:8080:8080"
    environment:
      QTERM_SYNC_TOKEN_SHA256: ${QTERM_SYNC_TOKEN_SHA256:?Set the SHA-256 digest of your random token}
    volumes:
      - sync-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  sync-data:
