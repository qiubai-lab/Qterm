name: qterm-sync
services:
  sync:
    image: ghcr.io/qiubai-lab/qterm-sync:latest
    restart: unless-stopped
    ports:
      # 本机访问；局域网直连时将 127.0.0.1 改为服务器的局域网 IP
      - "127.0.0.1:8080:8080"
    environment:
      # 必填：替换为自行生成的 64 位 SHA-256 摘要，客户端填写原始 Token
      QTERM_SYNC_TOKEN_SHA256: "REPLACE_WITH_YOUR_TOKEN_SHA256"
      QTERM_SYNC_LISTEN: "0.0.0.0:8080"
      QTERM_SYNC_DATA_DIR: "/data"
    volumes:
      - sync-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  sync-data:
