name: Web server runtime

on:
  pull_request:
  push:
    branches: [main, dev, dev-webruntime]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the tested main image to GHCR (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: web-server-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Linux quality and runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Install Rust check components
        shell: bash
        run: |
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openssh-server
          sudo mkdir -p /run/sshd
          python -m pip install websockets==13.1
      - name: Verify acceptance client regressions
        run: python scripts/test-server-fixtures.py
      - run: pnpm install --frozen-lockfile
      - name: Check shared frontend code
        # Keep shared-workbench coverage; build:web below owns type checking and bundling.
        run: |
          pnpm check:source-size
          pnpm lint
          pnpm test
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm check:server
      - run: cargo build --manifest-path crates/Cargo.toml --locked -p qterm-server
      - name: Verify HTTP, WebSocket, local PTY and SSH behavior
        run: |
          python scripts/test-server-live.py
          python scripts/test-server-local.py
          python scripts/test-server-retention.py
          python scripts/test-server-takeover.py
          python scripts/test-server-blocks.py
          python scripts/test-server-blocks-ssh.py
          python scripts/test-server-clipboard.py
          python scripts/test-server-clipboard.py --ssh
          python scripts/test-server-observation.py
          python scripts/test-server-observation-ssh.py
          python scripts/test-server-access-log.py
      - name: Upload web runtime assets
        uses: actions/upload-artifact@v7
        with:
          name: web-runtime-${{ github.sha }}
          path: |
            dist-web/
            dist-server/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  container:
    name: Container (linux/amd64)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install websockets==13.1
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and load the image for acceptance
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          # The Docker exporter loads one runnable image for the acceptance tests.
          provenance: false
          tags: qterm-server:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-server-amd64
          cache-to: type=gha,mode=max,scope=web-server-amd64
      - name: Verify container behavior and Compose deployment
        run: |
          test "$(docker image inspect qterm-server:local --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
          python scripts/test-server-container-entrypoint.py
          python scripts/test-server-local.py --container
          python scripts/test-server-retention.py --container
          python scripts/test-server-takeover.py --container
          python scripts/test-server-blocks.py --container
          python scripts/test-server-clipboard.py --container
          python scripts/test-server-compose.py
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested AMD64 image to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image))
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Push the exact image tested above; never rebuild after acceptance.
          while IFS= read -r tag; do
            docker tag qterm-server:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          digest="$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          test "${digest%%@*}" = "$IMAGE"
          {
            echo '### Published GHCR image (linux/amd64)'
            echo '```text'
            echo "$TAGS"
            echo "$digest"
            echo '```'
            echo 'Deploy with QTERM_IMAGE=<tag or image@sha256:digest> docker compose up -d --no-build --wait.'
          } >> "$GITHUB_STEP_SUMMARY"
