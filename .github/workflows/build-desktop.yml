name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "11.0.8"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match tag to Cargo package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            cargo metadata \
              --manifest-path src-tauri/Cargo.toml \
              --locked \
              --no-deps \
              --format-version 1 \
              | jq -r '.packages[0].version'
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Release tag v${tag_version} does not match Cargo package version ${cargo_version}." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate-release-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            artifactName: qterm-macos-arm64
            bundlePath: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifactName: qterm-macos-x64
            bundlePath: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifactName: qterm-windows-x64
            bundlePath: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifactName: qterm-linux-x64
            bundlePath: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              test "$(uname -m)" = "arm64"
              ;;
            x86_64-apple-darwin)
              test "$(uname -m)" = "x86_64"
              ;;
            x86_64-pc-windows-msvc)
              test "$RUNNER_ARCH" = "X64"
              ;;
            x86_64-unknown-linux-gnu)
              test "$(uname -m)" = "x86_64"
              ;;
          esac

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}-${{ github.sha }}
          path: ${{ matrix.bundlePath }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: qterm-*
          path: dist-artifacts
          merge-multiple: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-artifacts/**/*
